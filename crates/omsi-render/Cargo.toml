[package]
name = "omsi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer: textured, lit meshes with OMSI alpha modes; on-screen and off-screen targets"

[features]
default = ["test-hooks"]
# The fault-injection hook OMSI_FAKE_GPU_ERROR (see docs/DEBUG_FLAGS.md); a build without
# it cannot be made to fail on purpose.
test-hooks = []
# Optional native-wgpu FSR 3 compute backend; never built or run on a default/legacy installation.
fsr3-wgpu = ["dep:wgpu-ffx"]
# Real AMD FSR 2 WGSL port, adapted locally to the custom wgpu 29 fork.
fsr2-wgsl = ["dep:sp-fidelity", "dep:wgpu-naga-bridge"]

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-geometry = { path = "../omsi-geometry" }
omsi-texture = { path = "../omsi-texture" }
wgpu.workspace = true
# FSR 3 upscaler (not frame generation), uses wgpu 29 and the fork's patched wgpu.
# Gated until real Vulkan/DX12/Metal tests pass; FSR 1 stays untouched.
wgpu-ffx = { version = "=0.1.0", optional = true }
sp-fidelity = { version = "=0.2.0", optional = true }
wgpu-naga-bridge = { version = "29", optional = true }
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
rayon.workspace = true
hashbrown.workspace = true
log.workspace = true
anyhow.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }
# (the same glow as wgpu's GL backend, to turn ANGLE's parallel shader compiles off)
glow = "0.17"

[dev-dependencies]
naga = { workspace = true, features = ["spv-out", "glsl-out", "hlsl-out"] }
env_logger.workspace = true

[target.'cfg(windows)'.dev-dependencies.wgpu]
# Standalone renderer tests do not inherit omsi-app's ANGLE feature.
workspace = true
features = ["angle"]

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
