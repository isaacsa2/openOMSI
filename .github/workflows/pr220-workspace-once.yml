name: One-time PR220 workspace lockfile sync

on:
  push:
    branches:
      - preview/next-test-build
    paths:
      - .github/workflows/pr220-workspace-once.yml

permissions:
  contents: write

jobs:
  validate-and-lock:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile library and standalone converter examples
        run: cargo check -p omsi-proton --lib --examples --message-format=short
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-workspace-once.yml
          git add Cargo.lock
          git commit -m "build(proton): refresh lockfile for recovered converter"
          git push origin HEAD:refs/heads/preview/next-test-build
