name: One-time PR220 workspace validation

on:
  push:
    branches:
      - preview/next-test-build
    paths:
      - .github/workflows/pr220-workspace-once.yml

permissions:
  contents: write

jobs:
  validate-and-lock:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check recovered converter with current workspace
        run: cargo check -p omsi-proton --lib --message-format=short
      - name: Run converter unit tests
        run: cargo test -p omsi-proton --lib -- --test-threads=1
      - name: Commit regenerated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-workspace-once.yml
          git add Cargo.lock
          git commit -m "build(proton): update lockfile for converter workspace crate"
          git push origin HEAD:refs/heads/preview/next-test-build
