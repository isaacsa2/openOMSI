name: Experimental bgfx compile check

# Scope native C++ builds to the BGFX experiment. No full production release
# should be built by this workflow and no release artifacts are published.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "experiments/bgfx-port/**"
      - "scripts/audit-bgfx-port.py"
      - ".github/workflows/bgfx-experiment.yml"

permissions:
  contents: read

concurrency:
  group: bgfx-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory wgpu references
        run: python3 scripts/audit-bgfx-port.py --output bgfx-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: bgfx-port-inventory
          path: bgfx-inventory.json

  native-binding-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native window headers and C++ toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev
      - name: Compile isolated BGFX experiment and run CPU-only tests
        run: cargo test --manifest-path experiments/bgfx-port/Cargo.toml
      - name: Verify real O3D parser and staging through synthetic binary fixture
        shell: pwsh
        run: |
          python experiments/bgfx-port/generate-synthetic-o3d.py experiments/bgfx-port/synthetic-ci.o3d
          cargo run --manifest-path experiments/bgfx-port/Cargo.toml --bin bgfx-o3d-check -- experiments/bgfx-port/synthetic-ci.o3d
      - name: Initialize BGFX native Win32/DX11 surface and submit 8 frames
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run --manifest-path experiments/bgfx-port/Cargo.toml --bin bgfx-window -- --backend dx11 --frames 8
      - name: Upload isolated native Windows experiment for manual GPU testing
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-win32-experiment
          path: experiments/bgfx-port/target/debug/bgfx-window.exe
          if-no-files-found: warn
      # A successful clear-only smoke does not prove OMSI mesh or game rendering.

  production-contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure real omsi-render scene compiles with shared BGFX-neutral contract
        run: cargo check -p omsi-render --locked
