name: PR220 Proton compatibility probe

on:
  push:
    branches:
      - preview/next-test-build
    paths:
      - .github/workflows/pr220-compat-probe.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Register recovered crate in temporary runner workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          t = p.read_text()
          needle = 'members = [\n'
          assert needle in t, 'workspace format changed'
          p.write_text(t.replace(needle, needle + '    "crates/omsi-proton",\n', 1))
          PY
      - name: Check converter against current Rust and workspace APIs
        shell: bash
        run: |
          set -o pipefail
          cargo check -p omsi-proton --lib --message-format=short 2>&1 | tee /tmp/pr220-cargo-check.log
