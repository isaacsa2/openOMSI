name: One-shot Proton recovery maintenance

on:
  push:
    branches:
      - preview/next-test-build

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'isaacsa2/openOMSI' && contains(github.event.head_commit.message, '[proton-fix:run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only the five reported files
        run: |
          rustfmt --edition 2024 crates/omsi-proton/src/tests.rs
          rustfmt --edition 2024 crates/omsi-scene/src/lib.rs
          rustfmt --edition 2024 crates/omsi-scene/src/open.rs
          rustfmt --edition 2024 crates/omsi-scene/src/staging.rs
          rustfmt --edition 2024 crates/omsi-world/src/map_index.rs
      - name: Refresh the nested launcher dependency lockfile
        run: cargo metadata --manifest-path launcher/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Commit only formatting and launcher lockfile changes
        run: |
          git add -- crates/omsi-proton/src/tests.rs crates/omsi-scene/src/lib.rs crates/omsi-scene/src/open.rs crates/omsi-scene/src/staging.rs crates/omsi-world/src/map_index.rs launcher/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'No formatting or lockfile changes needed'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(proton): format integration and sync launcher lockfile'
          git push origin HEAD:preview/next-test-build
