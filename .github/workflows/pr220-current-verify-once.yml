name: PR220 verify integrated converter and installer

on:
  push:
    branches: [preview/next-test-build]
    paths: [.github/workflows/pr220-current-verify-once.yml]

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Format restored modules, then delete this workflow
        run: |
          set -euo pipefail
          rustfmt crates/omsi-launcher-core/src/lib.rs crates/omsi-launcher-core/src/content_lists.rs crates/omsi-launcher-core/src/timetable_lists.rs crates/omsi-launcher-core/src/game_settings.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-current-verify-once.yml
          git add crates/omsi-launcher-core
          git commit -m "style(proton): format repaired launcher module boundaries"
          git push origin HEAD:refs/heads/preview/next-test-build
      - name: Check repository source size policy
        run: bash scripts/size-budget.sh
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libx11-dev libxcb1-dev libssl-dev libgtk-3-dev
      - name: Check recovered crates
        run: cargo check -p omsi-cfg -p omsi-proton -p omsi-launcher-core -p omsi-sim -p omsi-vehicle -p omsi-world --all-targets --message-format=short
      - name: Run map and vehicle converter unit tests
        run: cargo test -p omsi-proton --lib -- --test-threads=1
      - name: Run Proton Maps installer unit tests
        run: cargo test -p omsi-launcher-core install::proton::tests --lib -- --test-threads=1
      - name: Run OI envelope tests
        run: cargo test -p omsi-cfg oi::tests --lib -- --test-threads=1
