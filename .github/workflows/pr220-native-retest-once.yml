name: PR220 native output tests after path corrections

on:
  push:
    branches: [preview/next-test-build]
    paths: [.github/workflows/pr220-native-retest-once.yml]

permissions:
  contents: write

jobs:
  test:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libx11-dev libxcb1-dev libssl-dev libgtk-3-dev
      - name: Test converted maps and buses in native file formats
        run: cargo test -p omsi-proton --lib -- --test-threads=1
      - name: Test Mods native map import
        run: cargo test -p omsi-launcher-core install::proton::tests --lib -- --test-threads=1
      - name: Verify source budgets
        run: bash scripts/size-budget.sh
      - name: Remove one-time test workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr220-native-retest-once.yml
          git commit -m 'chore(proton): remove native output retest workflow'
          git push origin HEAD:refs/heads/preview/next-test-build
