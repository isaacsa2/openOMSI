name: PR220 old integration merge audit

on:
  push:
    branches:
      - preview/next-test-build
    paths:
      - .github/workflows/pr220-merge-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare original feature integration against current main
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, tempfile, pathlib, os
          base="3c50e44cb3307204ebbc16cafc7447ad8376c0a2"
          old="22c8401e5d6bd868a7ee4e5ce031204eaa49552e"
          sh=lambda *cmd:subprocess.run(["git",*cmd],stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout
          changes=sh("diff","--name-status",base,old,"--","crates").decode().splitlines()
          allcounts={"clean":0,"conflict":0,"new":0,"skipped":0}
          for item in changes:
            s,p=item.split("\t",1)
            if p.startswith("crates/omsi-proton/"):continue
            if p.endswith(".lock"):continue
            cur=sh("show","HEAD:"+p)
            present=subprocess.run(["git","cat-file","-e","HEAD:"+p],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
            olddata=sh("show",old+":"+p)
            if s=="A":
              typ="new" if not present else "conflict"
              allcounts[typ]+=1
              print(f"{typ.upper():8} {p} {len(olddata)} bytes")
              continue
            basedata=sh("show",base+":"+p)
            if not present:
              print(f"CONFLICT {p} removed from current main")
              allcounts["conflict"]+=1
              continue
            with tempfile.TemporaryDirectory() as d:
              a,b,c=[pathlib.Path(d,n) for n in ("current","base","legacy")]
              a.write_bytes(cur);b.write_bytes(basedata);c.write_bytes(olddata)
              merged=subprocess.run(["git","merge-file","-p",str(a),str(b),str(c)],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              typ="clean" if merged.returncode==0 else "conflict"
              allcounts[typ]+=1
              print(f"{typ.upper():8} {p} changes={len(merged.stdout.splitlines())-len(cur.splitlines())}")
          print("SUMMARY", allcounts)
          PY
      - name: Remove one-time diagnostics workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-merge-audit-once.yml
          git commit -m "chore(proton): clean up integration merge audit"
          git push origin HEAD:refs/heads/preview/next-test-build
