name: One-time rustfmt recovery for PR 220

on:
  push:
    branches:
      - preview/next-test-build
    paths:
      - .github/workflows/pr220-format-once.yml

permissions:
  contents: write

jobs:
  format-recovered-crate:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format only restored converter files
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          find crates/omsi-proton -type f -name '*.rs' -print0 | xargs -0 rustfmt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-format-once.yml
          git add crates/omsi-proton
          if ! git diff --cached --quiet; then
            git commit -m "style(proton): format restored converter sources"
            git push origin HEAD:refs/heads/preview/next-test-build
          fi
