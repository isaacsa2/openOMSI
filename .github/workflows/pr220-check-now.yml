name: PR220 final native build and focused tests

on:
  push:
    branches: [preview/next-test-build]
    paths: [.github/workflows/pr220-check-now.yml]

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Source size limits
        run: bash scripts/size-budget.sh
      - name: Linux native compilation libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libx11-dev libxcb1-dev libssl-dev libgtk-3-dev
      - name: Build converter, launcher, AI and vehicle crates
        run: cargo check -p omsi-proton -p omsi-cfg -p omsi-launcher-core -p omsi-sim -p omsi-vehicle -p omsi-world --all-targets --message-format=short
      - name: Test Proton conversion
        run: cargo test -p omsi-proton --lib -- --test-threads=1
      - name: Test Mods import and source checks
        run: cargo test -p omsi-launcher-core install::proton::tests --lib -- --test-threads=1
      - name: Test OI envelopes
        run: cargo test -p omsi-cfg oi::tests --lib -- --test-threads=1
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-check-now.yml
          git commit -m "chore(proton): remove one-time compatibility checks"
          git push origin HEAD:refs/heads/preview/next-test-build
