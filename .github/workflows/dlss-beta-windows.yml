name: NVIDIA DLSS beta Windows build

on:
  push:
    branches:
      - feat/nvidia-dlss-streamline-opt-in
    paths:
      - '.github/workflows/dlss-beta-windows.yml'
      - 'crates/omsi-render/**'
      - 'crates/omsi-app/**'
      - 'crates/omsi-launcher-core/**'
      - 'launcher/ui/**'
      - 'docs/NVIDIA_DLSS_BETA_TEST.md'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-build:
    name: Build Windows x64 DLSS / DLAA + launcher beta
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            launcher/src-tauri -> target
      - name: Build beta game with optional DX12 Streamline runtime
        shell: pwsh
        run: cargo build --locked --release --package omsi-app --bin openomsi --features omsi-render/nvidia-dlss-experimental --target x86_64-pc-windows-msvc
      - name: Build the companion launcher with its DLSS settings UI
        shell: pwsh
        run: |
          cargo build --locked --release --package omsi-launcher-core --target x86_64-pc-windows-msvc
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path launcher/src-tauri/Cargo.toml
      - name: Package executable and beta-test guide (NVIDIA DLLs are never included)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dlss-beta | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/openomsi.exe dlss-beta/openomsi.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/openomsi-launcher.exe dlss-beta/openomsi-launcher.exe
          Copy-Item launcher/src-tauri/target/x86_64-pc-windows-msvc/release/openomsi-launcher-app.exe dlss-beta/openomsi-launcher-app.exe
          Copy-Item assets/steam_redist/steam_api64.dll dlss-beta/steam_api64.dll
          Copy-Item docs/NVIDIA_DLSS_BETA_TEST.md dlss-beta/README_DLSS_BETA.md
          Copy-Item docs/NVIDIA_DLSS_THIRD_PARTY_NOTICES.txt dlss-beta/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openOMSI-DLSS-beta-windows-x64
          path: dlss-beta/
          retention-days: 7
          if-no-files-found: error
