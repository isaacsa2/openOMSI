name: PR220 sync Cargo lockfile

on:
  push:
    branches: [preview/next-test-build]
    paths: [.github/workflows/pr220-sync-lockfile.yml]

permissions:
  contents: write

jobs:
  resolve:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve workspace dependencies and refresh lockfile
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Commit lockfile and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-sync-lockfile.yml
          if test -f .github/workflows/pr220-check-now.yml; then
            git rm .github/workflows/pr220-check-now.yml
          fi
          git add Cargo.lock
          git commit -m "build(proton): lock current scene, converter and launcher dependencies"
          git push origin HEAD:refs/heads/preview/next-test-build
