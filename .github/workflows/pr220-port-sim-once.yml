name: PR220 simulation and vehicle compatibility port

on:
  push:
    branches: [preview/next-test-build]
    paths: [.github/workflows/pr220-port-sim-once.yml]

permissions:
  contents: write

jobs:
  port:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge nonconflicting Proton simulation and vehicle changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,tempfile
          from pathlib import Path
          base="3c50e44cb3307204ebbc16cafc7447ad8376c0a2"
          original="22c8401e5d6bd868a7ee4e5ce031204eaa49552e"
          clean=[
              "crates/omsi-sim/src/ai_traffic/dormant.rs",
              "crates/omsi-sim/src/people.rs",
              "crates/omsi-sim/src/people/populate.rs",
              "crates/omsi-sim/src/people/world.rs",
              "crates/omsi-sim/src/world_data/mod.rs",
              "crates/omsi-sim/src/world_data/traits.rs",
              "crates/omsi-vehicle/src/vehicle.rs",
              "crates/omsi-world/src/map_index.rs",
          ]
          for path in clean:
              with tempfile.TemporaryDirectory() as d:
                  filenames=[]
                  for label,rev in [("current","HEAD"),("base",base),("original",original)]:
                      file=Path(d,label)
                      file.write_bytes(subprocess.check_output(["git","show",f"{rev}:{path}"]))
                      filenames.append(str(file))
                  out=subprocess.run(["git","merge-file","-p",*filenames],capture_output=True)
                  if out.returncode!=0:
                      raise RuntimeError(f"Merge conflict in {path}: {out.stderr.decode()}")
                  Path(path).write_bytes(out.stdout)
                  print("PORT",path)
          new="crates/omsi-sim/src/people/unscheduled_tests.rs"
          Path(new).write_bytes(subprocess.check_output(["git","show",f"{original}:{new}"]))
          print("RESTORE",new)
          PY
          rustfmt crates/omsi-sim/src/ai_traffic/dormant.rs crates/omsi-sim/src/people.rs crates/omsi-sim/src/people/populate.rs crates/omsi-sim/src/people/world.rs crates/omsi-sim/src/world_data/mod.rs crates/omsi-sim/src/world_data/traits.rs crates/omsi-sim/src/people/unscheduled_tests.rs crates/omsi-vehicle/src/vehicle.rs crates/omsi-world/src/map_index.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-port-sim-once.yml
          git add crates/omsi-sim crates/omsi-vehicle/src/vehicle.rs crates/omsi-world/src/map_index.rs
          git commit -m "feat(proton): restore unscheduled passenger, AI and OI vehicle support"
          git push origin HEAD:refs/heads/preview/next-test-build
      - name: Compile simulation, vehicles and world index
        run: cargo check -p omsi-sim -p omsi-vehicle -p omsi-world --all-targets --message-format=short
      - name: Test unscheduled passenger behaviour
        run: cargo test -p omsi-sim people::unscheduled_tests --lib -- --test-threads=1
