name: One-shot Proton launcher formatting

on:
  push:
    branches:
      - preview/next-test-build

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'isaacsa2/openOMSI' && contains(github.event.head_commit.message, '[proton-style:run]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format revised launcher map listing
        run: |
          rustfmt --edition 2024 crates/omsi-launcher-core/src/lib.rs
          rustfmt --edition 2024 crates/omsi-launcher-core/src/map_dates.rs
          git add -- crates/omsi-launcher-core/src/lib.rs crates/omsi-launcher-core/src/map_dates.rs
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(proton): format map HOF fallback and date helper extraction'
          git push origin HEAD:preview/next-test-build
