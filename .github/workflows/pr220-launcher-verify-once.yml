name: PR220 compile after launcher modularization

on:
  push:
    branches: [preview/next-test-build]
    paths: [.github/workflows/pr220-launcher-verify-once.yml]

permissions:
  contents: write

jobs:
  compile:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Format revived launcher modules
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          rustfmt crates/omsi-launcher-core/src/lib.rs crates/omsi-launcher-core/src/content_lists.rs crates/omsi-launcher-core/src/timetable_lists.rs crates/omsi-launcher-core/src/game_settings.rs crates/omsi-launcher-core/src/install.rs crates/omsi-launcher-core/src/install/runner.rs crates/omsi-launcher-core/src/install/planner.rs crates/omsi-launcher-core/src/install_proton_tests.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-launcher-verify-once.yml
          git add crates/omsi-launcher-core
          git commit -m "style(launcher): format modular installer and content listings"
          git push origin HEAD:refs/heads/preview/next-test-build
      - name: Inspect source size budget
        run: bash scripts/size-budget.sh
        continue-on-error: true
      - name: Install host development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libx11-dev libxcb1-dev libssl-dev libgtk-3-dev
      - name: Build launcher and converter all targets
        run: cargo check -p omsi-launcher-core -p omsi-proton --all-targets --message-format=short
      - name: Run unit tests for Proton converter
        run: cargo test -p omsi-proton --lib -- --test-threads=1
      - name: Run unit tests for Proton Mods installation
        run: cargo test -p omsi-launcher-core install::proton::tests --lib -- --test-threads=1
