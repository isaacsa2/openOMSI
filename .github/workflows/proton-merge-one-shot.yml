name: One-shot Proton upstream sync

on:
  push:
    branches:
      - preview/next-test-build

permissions:
  contents: write

jobs:
  merge-main:
    if: github.repository == 'isaacsa2/openOMSI' && contains(github.event.head_commit.message, '[proton-merge:run]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge current main, preferring main only at overlapping conflict hunks
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff -X theirs origin/main
          # Both conflicted files are module/API registries; use the current main
          # wholesale to avoid duplicate declarations generated by a hunk-level merge.
          # Proton integration lives in the separate install_proton and converter modules.
          git show origin/main:crates/omsi-launcher-core/src/lib.rs > crates/omsi-launcher-core/src/lib.rs
          git show origin/main:crates/omsi-sim/src/people.rs > crates/omsi-sim/src/people.rs
          if ! grep -q '^mod unscheduled_tests;' crates/omsi-sim/src/people.rs; then
            printf '\n#[cfg(test)]\nmod unscheduled_tests;\n' >> crates/omsi-sim/src/people.rs
          fi
          rustfmt --edition 2024 crates/omsi-sim/src/people.rs
          cargo metadata --manifest-path launcher/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --manifest-path Cargo.toml --format-version 1 > /dev/null
          git add -- crates/omsi-sim/src/people.rs crates/omsi-launcher-core/src/lib.rs Cargo.lock launcher/src-tauri/Cargo.lock
          git diff --cached --check
      - name: Install the same Linux native dependencies as release CI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev libwebkit2gtk-4.1-dev zip clang lld
      - name: Check converter and launcher against merged main
        run: cargo check --locked -p omsi-proton -p omsi-launcher-core -p omsi-scene -p omsi-sim --all-targets
      - name: Commit and publish validated merge
        run: |
          git commit -m "Merge latest main into Proton conversion preview"
          git push origin HEAD:preview/next-test-build
