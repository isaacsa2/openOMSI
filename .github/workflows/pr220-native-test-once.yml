name: PR220 native formats regression check

on:
  push:
    branches: [preview/next-test-build]
    paths:
      - .github/workflows/pr220-native-test-once.yml

permissions:
  contents: write

jobs:
  test:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install openOMSI Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libx11-dev libxcb1-dev libssl-dev libgtk-3-dev
      - name: Compile converter, launcher, and runtime with native generated assets
        run: cargo check -p omsi-proton -p omsi-map -p omsi-launcher-core -p omsi-scene --all-targets --message-format=short
      - name: Check native map and vehicle output tests
        run: cargo test -p omsi-proton --lib -- --test-threads=1
      - name: Check native map installation from Mods
        run: cargo test -p omsi-launcher-core install::proton::tests --lib -- --test-threads=1
      - name: Check source and function size limits
        run: bash scripts/size-budget.sh
      - name: Remove one-time test workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr220-native-test-once.yml
          git commit -m 'chore(proton): remove temporary native formats CI'
          git push origin HEAD:refs/heads/preview/next-test-build
