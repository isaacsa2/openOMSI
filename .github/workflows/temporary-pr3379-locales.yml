name: Temporary PR 3379 locale expansion
on:
  push:
    branches:
      - feat/launcher-disable-plugins-20261027
    paths:
      - .github/workflows/temporary-pr3379-locales.yml
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add missing locale entries without rewriting catalog through API
        run: |
          python3 .github/scripts/temporary-pr3379-locales.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/omsi-app/locales/app.yml
          git rm .github/workflows/temporary-pr3379-locales.yml .github/scripts/temporary-pr3379-locales.py
          git diff --cached --check
          git commit -m "fix(i18n): complete plugin isolation texts for all 29 locales"
          git push origin HEAD:feat/launcher-disable-plugins-20261027
