name: PR220 native Linux integration compile probe

on:
  push:
    branches: [preview/next-test-build]
    paths: [.github/workflows/pr220-native-probe-once.yml]

permissions:
  contents: write

jobs:
  compile:
    if: github.repository == 'isaacsa2/openOMSI'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install host development libraries used by openOMSI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libx11-dev libxcb1-dev libssl-dev libgtk-3-dev
      - name: Check Proton launcher and all recovered converter targets
        run: cargo check -p omsi-launcher-core -p omsi-proton --all-targets --message-format=short
      - name: Run converter tests
        run: cargo test -p omsi-proton --lib -- --test-threads=1
      - name: Run Proton importer install tests
        run: cargo test -p omsi-launcher-core install::proton::tests --lib -- --test-threads=1
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr220-native-probe-once.yml
          git commit -m "chore(proton): remove one-time native compile probe"
          git push origin HEAD:refs/heads/preview/next-test-build
