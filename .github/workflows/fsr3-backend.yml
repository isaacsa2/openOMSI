# Opt-in FSR3 backend smoke check. Default release builds stay unchanged.
name: FSR3 wgpu backend

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/omsi-render/**"
      - ".github/workflows/fsr3-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Avoid spending shared runner time on unrelated upstream contributions.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 302
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fsr3-wgpu
      - name: Check real FSR3 backend (not just feature-gated stubs)
        run: cargo check --locked -p omsi-render --lib --features fsr3-wgpu
      - name: Unit tests for the FSR3 input shader and temporal policy
        run: cargo test --locked -p omsi-render --lib --features fsr3-wgpu --no-default-features -- temporal:: --nocapture
